groups:
  - name: horizon_failover
    interval: 60s
    rules:
      # ── Warning: failovers are happening at all ───────────────────────────
      # horizon_failover_total (horizonFailoverClient.js) increments every
      # time a call fails over from one Horizon endpoint to the next. In
      # steady state this should be ~0; any sustained rate means the
      # currently-active endpoint (or endpoints) is degraded.
      - alert: HorizonFailoverEventsOccurring
        expr: sum(rate(horizon_failover_total[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Horizon endpoint failovers are occurring"
          description: >
            The Horizon failover client has been switching endpoints for 15
            minutes ({{ $value | printf "%.4f" }}/s). Check
            horizon_circuit_breaker_state per endpoint (0=closed, 1=open,
            2=half_open) to see which Horizon URL is degraded.

      # ── Critical: a circuit breaker has been open for a sustained period ──
      # horizon_circuit_breaker_state == 1 means that endpoint has been pulled
      # out of rotation after CB_FAILURE_THRESHOLD consecutive 5xx/429/network
      # failures. A single endpoint open briefly is expected recovery
      # behaviour; open for 5+ minutes means it is not coming back on its own.
      - alert: HorizonCircuitBreakerOpen
        expr: horizon_circuit_breaker_state == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Horizon circuit breaker open for {{ $labels.url }}"
          description: >
            The circuit breaker for Horizon endpoint {{ $labels.url }} has
            been open for over 5 minutes. Traffic is failing over to the next
            configured endpoint (if any). Check that endpoint's health
            directly.

      # ── Critical: every configured Horizon endpoint is unavailable ───────
      # min() across all endpoints' circuit-breaker state is 1 only when every
      # single one is open (closed=0 or half_open=2 would pull the min down).
      # This is the "HORIZON_ALL_UNAVAILABLE" condition from
      # horizonFailoverClient.js#call — payment sync is fully stalled.
      - alert: HorizonAllEndpointsUnavailable
        expr: min(horizon_circuit_breaker_state) == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "All Horizon endpoints are unavailable — payment sync stalled"
          description: >
            Every configured Horizon endpoint has had its circuit breaker open
            for at least 2 minutes. The transaction poller cannot reach
            Horizon at all; no new payments are being confirmed. Page on-call
            immediately.
