name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (boots + parses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check every tracked .js file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! node --check "$file"; then
              echo "::error file=$file::node --check failed"
              fail=1
            fi
          done < <(git ls-files '*.js')
          exit "$fail"

      - name: Fail on truncated-file placeholders
        run: |
          if git grep -n -E "truncated [0-9]+ chars"; then
            echo "::error::Found truncated-file placeholder markers in tracked files"
            exit 1
          fi
          echo "No truncated-file placeholders found"

      - name: Boot backend app with dummy env (no DB)
        env:
          NODE_ENV: test
        run: |
          node -e "require('./backend/src/app')"

  lockfile-sync:
    name: Lockfile sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify root package-lock.json is in sync
        run: npm ci --dry-run

      - name: Verify frontend package-lock.json is in sync
        working-directory: frontend
        run: npm ci --dry-run

      - name: Verify backend package-lock.json is in sync
        working-directory: backend
        run: npm ci --dry-run

  route-contract:
    name: Route manifest and frontend API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            node_modules
          key: ${{ runner.os }}-route-contract-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-route-contract-
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Check generated route manifest and API contract
        run: npm run test:contract

  property:
    name: Property-based money invariants
    runs-on: ubuntu-latest
    env:
      FC_SEED: 18231824
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-property-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-property-
      - run: npm ci
      - name: Run fixed-seed money property suite
        run: npm run test:property

  integration:
    name: Critical integration flows
    runs-on: ubuntu-latest
    env:
      STELLAR_INTEGRATION_TESTS: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            node_modules
          key: ${{ runner.os }}-integration-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-integration-
      - name: Install root dependencies
        run: npm ci
      - name: Install backend dependencies
        run: cd backend && npm ci
      - name: Run critical integration project
        run: npm run test:integration

  # ── #1389: Test coverage enforcement ───────────────────────────────────────
  # Collects backend (root jest config) and frontend coverage and uploads the
  # reports as downloadable artefacts on every PR, so reviewers can inspect
  # exactly which code paths a change exercises. Per-directory Jest
  # coverageThreshold values are configured in package.json (backend) and
  # frontend/jest.config.js (frontend). Jest exits non-zero when any threshold
  # is breached, so this job is GATING via the ci-gate job below.
  #
  # Threshold ladder (raise incrementally as coverage improves):
  #   - Start: global 46 % branches / 37 % functions / 51 % lines (backend)
  #            global 47 % branches / 22 % functions / 39 % lines (frontend)
  #   - Target: raise each value by ~5 pp per sprint until ≥ 80

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Dependency audit
        run: npm audit --audit-level=high
