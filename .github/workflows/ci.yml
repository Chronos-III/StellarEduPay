name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (boots + parses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check every tracked .js file
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r file; do
            if ! node --check "$file"; then
              echo "::error file=$file::node --check failed"
              fail=1
            fi
          done < <(git ls-files '*.js')
          exit "$fail"

      - name: Fail on truncated-file placeholders
        run: |
          if git grep -n -E "truncated [0-9]+ chars"; then
            echo "::error::Found truncated-file placeholder markers in tracked files"
            exit 1
          fi
          echo "No truncated-file placeholders found"

      - name: Boot backend app with dummy env (no DB)
        env:
          NODE_ENV: test
        run: |
          node -e "require('./backend/src/app')"

  lockfile-sync:
    name: Lockfile sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify root package-lock.json is in sync
        run: npm ci --dry-run

      - name: Verify frontend package-lock.json is in sync
        working-directory: frontend
        run: npm ci --dry-run

      - name: Verify backend package-lock.json is in sync
        working-directory: backend
        run: npm ci --dry-run

  # ── #1389: Test coverage enforcement ───────────────────────────────────────
  # Collects backend (root jest config) and frontend coverage and uploads the
  # reports as downloadable artefacts on every PR, so reviewers can inspect
  # exactly which code paths a change exercises. Per-directory Jest
  # coverageThreshold values are configured in package.json (backend) and
  # frontend/jest.config.js (frontend). Jest exits non-zero when any threshold
  # is breached, so this job is GATING via the ci-gate job below.
  #
  # Threshold ladder (raise incrementally as coverage improves):
  #   - Start: global 46 % branches / 37 % functions / 51 % lines (backend)
  #            global 47 % branches / 22 % functions / 39 % lines (frontend)
  #   - Target: raise each value by ~5 pp per sprint until ≥ 80
  #
  # #1635: on top of the Jest floors, scripts/coverage-ratchet.js compares this
  # run against coverage-baseline.json and fails if any global metric — or the
  # line coverage of any file changed in the PR — went down. The result is
  # posted as a sticky PR comment. Raise the baseline with
  # `npm run coverage:ratchet -- --update` after coverage improves.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      MONGO_URI: mongodb://localhost:27017/stellaredupay_test?replicaSet=rs0
      JWT_SECRET: ci-test-jwt-secret-not-used-in-production
      SCHOOL_WALLET_ADDRESS: GBBD47IF6LWK7P7MDEVSCWR7DPUWV3NY3DTQEVFL4NAT4AQH3ZLLFLA5
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { if (rs.status().ok !== 1) { throw new Error(\"rs not initiated\"); } } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }); } catch (e2) {} process.exit(1); } if (!db.hello().isWritablePrimary) { process.exit(1); }'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: actions/cache@v6
        with:
          path: |
            backend/node_modules
            frontend/node_modules
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - run: npm ci
      - run: cd backend && npm ci && cd ..
      - run: cd frontend && npm ci && cd ..
      - name: Backend coverage
        run: npm run coverage
      - name: Frontend coverage
        if: always()
        run: npm run coverage:frontend
      - name: Coverage ratchet
        if: always()
        run: node scripts/coverage-ratchet.js --base origin/${{ github.base_ref || 'main' }} --markdown coverage/ratchet.md
      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage-ratchet
          path: coverage/ratchet.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Dependency audit
        run: npm audit --audit-level=high
