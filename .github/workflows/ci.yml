name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-sync:
    name: Lockfile sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify root package-lock.json is in sync
        run: npm ci --dry-run

      - name: Verify frontend package-lock.json is in sync
        working-directory: frontend
        run: npm ci --dry-run

      - name: Verify backend package-lock.json is in sync
        working-directory: backend
        run: npm ci --dry-run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Dependency audit
        run: npm audit --audit-level=high
